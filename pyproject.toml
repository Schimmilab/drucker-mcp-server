[project]
name = "drucker-mcp-server"
version = "0.1.3"
description = "MCP-Server für CUPS-Drucker: Etiketten passend zur eingelegten Rolle (Brother QL) und Dokumente (PDF, Markdown) drucken"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jürgen Schilling" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.5",
    "markdown==3.11.2",
    "pillow==13.0.0",
    "qrcode==8.2",
    "zeroconf==0.151.5",
]

[project.scripts]
drucker-mcp = "drucker_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drucker_mcp"]
